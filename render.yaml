# Render Blueprint (TÙY CHỌN). Cách chính trong báo cáo là tạo dịch vụ thủ công trên dashboard
# để chụp ảnh từng bước; file này dùng khi cần tạo lại nhanh: Render → New → Blueprint → chọn repo.
# Các biến có "sync: false" sẽ được Render hỏi giá trị khi tạo (không lưu bí mật trong repo).
services:
  - type: web
    name: graphrag-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: graphrag-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
